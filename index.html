    <script>
      // Prevent benign dev-server WebSocket reconnection failures in sandboxed iframes from triggering error overlays
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var message = (reason && (reason.message || reason.description || reason)) || '';
        if (
          typeof message === 'string' &&
          (message.includes('WebSocket') || message.includes('websocket') || message.includes('closed without opened'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
